# Quix Project Descriptor
# This file describes the data pipeline and configuration of resources of a Quix Project.

metadata:
  version: 1.0

# This section describes the Deployments of the data pipeline
deployments:
  - name: Grafana
    application: grafana
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: grafana
    state:
      enabled: true
      size: 1
    network:
      serviceName: grafana
      ports:
        - port: 80
          targetPort: 3000
    variables:
      - name: GF_SECURITY_ADMIN_PASSWORD
        inputType: Secret
        description: ''
        required: true
        secretKey: admin_passport
      - name: INFLUXDB_TOKEN
        inputType: Secret
        description: ''
        required: true
        secretKey: admin_passport
  - name: Prometheus
    application: prometheus
    version: latest
    deploymentType: Service
    resources:
      cpu: 1000
      memory: 2000
      replicas: 1
    state:
      enabled: true
      size: 5
    network:
      serviceName: prometheus
      ports:
        - port: 80
          targetPort: 9090
  - name: PushGateway
    application: push-gateway
    version: latest
    deploymentType: Service
    resources:
      cpu: 1000
      memory: 4000
      replicas: 1
    network:
      serviceName: pushgateway
      ports:
        - port: 80
          targetPort: 9091
  - name: Push Gateway proxy
    application: push-gateway-proxy
    version: latest
    deploymentType: Service
    resources:
      cpu: 200
      memory: 500
      replicas: 1
    publicAccess:
      enabled: true
      urlPrefix: pushgatewayproxy
    variables:
      - name: PUSHGATEWAY_URL
        inputType: FreeText
        required: true
        value: http://pushgateway:80
      - name: BASIC_AUTH_USER
        inputType: FreeText
        value: admin
      - name: BASIC_AUTH_PASS
        inputType: Secret
        required: true
        secretKey: admin_passport

